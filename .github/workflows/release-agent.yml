# Builds the standalone agent for Linux and Windows and publishes it as a
# GitHub release when a tag like agent-v0.2.0 is pushed.
#
# The server URL and Discord application ID baked into the executables come
# from the repository variables NSA_SERVER_URL and NSA_DISCORD_CLIENT_ID
# (Settings > Secrets and variables > Actions > Variables).
name: Release agent

on:
  push:
    tags: ['agent-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            exe: nsa-agent
            asset: nsa-agent-linux-x64
          - os: windows-latest
            exe: nsa-agent.exe
            asset: nsa-agent-windows-x64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:sea
        env:
          NSA_SERVER_URL: ${{ vars.NSA_SERVER_URL }}
          NSA_DISCORD_CLIENT_ID: ${{ vars.NSA_DISCORD_CLIENT_ID }}
      - name: Smoke test
        run: ./dist/sea/${{ matrix.exe }} version
      - run: mv dist/sea/${{ matrix.exe }} dist/sea/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: agent/dist/sea/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
